name: build-dylib

# 构建单个 .dylib，macos-latest + Apple clang（2026-11-22 改）：
#   根因：GOOS=darwin 编的 Go runtime 带 macOS 独有符号
#   （_notify_is_valid_token、_xpc_date_create_from_current，iOS 的
#   libSystem 里没有；弱链接下加载失败是静默的——不崩、没日志、端口
#   不通）。GOOS=ios + c-archive 是 gomobile bind -target=ios 的官
#   方路线。仓库已公开，macOS runner 额度无限，不用 ubuntu+zig 了。
#   步骤：GOOS=ios c-archive（xcrun clang wrapper）→ patch .a 兜底
#   → Apple clang -Wl,-all_load 链 dylib → install_name_tool
#   → ldid -S（brew 装不上就 codesign ad-hoc 兜底）→ otool 五项
#   校验 + python 全验 → artifact
#   注：zig 链不了 platform=2 的 .o（报 invalid platform:
#   aarch64-ios），所以 Linux+zig 链接路线已废弃；Linux+zig 编
#   GOOS=ios 归档本身是通的（2026-11-22 本机实测），只是链接必须
#   用 Apple clang（或不改 .a、改最终 dylib 的平台标记）。
#   注 2：链接时多加 -framework Security——Go runtime 引用 Security
#   符号（darwin 产物实测 7 个 Sec 符号），只加 CoreFoundation 会
#   链不上。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Xcode / iOS SDK 检查
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang

      - name: Version (upstream 约定：上海时间 vYYYY.M.D.HMM)
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="$(TZ=Asia/Shanghai date +%Y.%-m.%-d.%-H%M)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version=$V"

      - name: go vet (carchive 入口)
        run: go vet ./cmd/carchive/

      - name: go test (上游单测)
        run: go test ./... 2>&1 | tail -30

      - name: Build c-archive (GOOS=ios, xcrun clang)
        run: |
          cat > /tmp/ios-clang.sh <<'EOF'
          #!/bin/sh
          SDK=iphoneos
          exec "$(xcrun --sdk $SDK --find clang)" \
               -arch arm64 \
               -isysroot "$(xcrun --sdk $SDK --show-sdk-path)" \
               -miphoneos-version-min=14.0 "$@"
          EOF
          chmod +x /tmp/ios-clang.sh
          export CGO_ENABLED=1 GOOS=ios GOARCH=arm64
          export CC=/tmp/ios-clang.sh
          go build -trimpath \
            -ldflags="-s -w -X main.appVersion=${{ steps.ver.outputs.version }}" \
            -buildmode=c-archive -o libwb2api.a ./cmd/carchive
          ls -l libwb2api.a libwb2api.h

      - name: Patch archive platform (兜底：正常应已是 iOS(2))
        run: |
          python3 scripts/patch_archive_platform.py libwb2api.a libwb2api-ios.a
          ls -l libwb2api-ios.a

      - name: Link tweak dylib (Apple clang, -all_load)
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib \
            -target arm64-apple-ios14.0 \
            -isysroot "$SDK_PATH" \
            -Wl,-all_load libwb2api-ios.a \
            -framework CoreFoundation -framework Security -lresolv \
            -o wb2api.dylib tweak/tweak.c
          install_name_tool -id "@rpath/wb2api.dylib" wb2api.dylib
          ls -l wb2api.dylib

      - name: Sign (ldid -S, 装不上就 codesign ad-hoc 兜底)
        run: |
          if ! command -v ldid >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid || true
          fi
          if command -v ldid >/dev/null 2>&1; then
            ldid -S wb2api.dylib
            echo "ldid 签名成功"
          else
            codesign --force --sign - wb2api.dylib
            echo "codesign ad-hoc 签名成功"
          fi

      - name: Verify (otool 五项 + python 全验)
        run: |
          echo "--- 1. LC_LOAD_DYLINKER 必须为 0 ---"
          test "$(otool -l wb2api.dylib | grep -c LC_LOAD_DYLINKER)" = "0"
          echo "--- 2. LC_BUILD_VERSION platform 必须为 2 ---"
          otool -l wb2api.dylib | grep -A3 LC_BUILD_VERSION
          otool -l wb2api.dylib | grep -A3 LC_BUILD_VERSION | grep -q "platform 2"
          echo "--- 3. __LLVM 必须为 0 ---"
          test "$(otool -l wb2api.dylib | grep -c __LLVM)" = "0"
          echo "--- 4. nm WBStart 必须有 ---"
          nm -gU wb2api.dylib | grep WBStart
          echo "--- 5. codesign 必须能正常显示 ---"
          codesign -dv wb2api.dylib
          python3 - <<'EOF'
          import struct
          data = open('wb2api.dylib','rb').read()
          assert struct.unpack('<I', data[:4])[0] == 0xfeedfacf, "不是 Mach-O 64"
          ncmds, = struct.unpack('<I', data[16:20])
          off = 32
          symoff = nsyms = stroff = 0
          for _ in range(ncmds):
              cmd, size = struct.unpack('<II', data[off:off+8])
              if cmd == 0x32:
                  platform, minos, sdk, _ = struct.unpack('<IIII', data[off+8:off+24])
                  print(f"LC_BUILD_VERSION platform={platform} minos={minos:#x}")
                  assert platform == 2, "平台标记不对"
              if cmd == 0x2:
                  symoff, nsyms, stroff, _ = struct.unpack('<IIII', data[off+8:off+24])
              if cmd == 0xd:
                  name_off, = struct.unpack('<I', data[off+8:off+12])
                  end = data.index(b'\x00', off+name_off)
                  ident = data[off+name_off:end].decode()
                  print("LC_ID_DYLIB:", ident)
                  assert ident == "@rpath/wb2api.dylib", "install name 不对"
              if cmd == 0x1d:
                  doff, dsize = struct.unpack('<II', data[off+8:off+16])
                  assert dsize > 0, "无签名"
                  smagic, slen, scount = struct.unpack('>III', data[doff:doff+12])
                  assert smagic == 0xfade0cc0, "签名 superblob 魔数不对"
                  blobs = {struct.unpack('>I', data[doff+12+i*8:doff+16+i*8])[0] for i in range(scount)}
                  assert 0 in blobs, "签名里无 CodeDirectory"
                  print(f"签名 OK: superblob len={slen} blobs={sorted(hex(b) for b in blobs)}")
              if cmd == 0xc:
                  name_off, = struct.unpack('<I', data[off+8:off+12])
                  end = data.index(b'\x00', off+name_off)
                  print("链接库:", data[off+name_off:end].decode())
              off += size
          names = set()
          undef = set()
          for i in range(nsyms):
              n_strx, n_type, n_sect, n_desc, n_value = struct.unpack('<IBBHQ', data[symoff+i*16:symoff+i*16+16])
              if n_type & 0x0e == 0x0e:
                  end = data.index(b'\x00', stroff+n_strx)
                  names.add(data[stroff+n_strx:end].decode('utf-8','replace'))
              if n_sect == 0 and (n_type & 0x0e) == 0x00 and (n_type & 0x01):
                  end = data.index(b'\x00', stroff+n_strx)
                  undef.add(data[stroff+n_strx:end].decode('utf-8','replace'))
          for s in ('_WBStart','_WBStop','_WBVersion','_WBJSON','_WBFree'):
              assert s in names, f"缺少导出符号 {s}"
          print("WB 导出符号齐全:", sorted(n for n in names if n.startswith('_WB') and not n.endswith('_cgo_zero')))
          # GOOS=darwin 的产物带 macOS 独有符号，GOOS=ios 必须没有
          for s in ('_notify_is_valid_token','_xpc_date_create_from_current'):
              assert s not in undef, f"仍有 macOS 独有符号 {s}"
          print("无 macOS 独有符号（_notify_is_valid_token、_xpc_date_create_from_current 均已消除）")
          # 初始化顺序：Go runtime 必须在 _wb_ctor 之前，否则构造器调 WBStart 会死锁
          import bisect
          syms = []
          for i in range(nsyms):
              n_strx, n_type, n_sect, n_desc, n_value = struct.unpack('<IBBHQ', data[symoff+i*16:symoff+i*16+16])
              if n_sect != 0:
                  end = data.index(b'\x00', stroff+n_strx)
                  syms.append((n_value, data[stroff+n_strx:end].decode('utf-8','replace')))
          syms.sort()
          addrs = [s[0] for s in syms]
          def symname(addr):
              k = bisect.bisect_right(addrs, addr) - 1
              return syms[k][1] if k >= 0 else '?'
          ncmds2, = struct.unpack('<I', data[16:20])
          off2 = 32
          order = []
          for _ in range(ncmds2):
              cmd2, size2 = struct.unpack('<II', data[off2:off2+8])
              if cmd2 == 0x19:
                  nsects2, = struct.unpack('<I', data[off2+64:off2+68])
                  soff2 = off2 + 72
                  for i2 in range(nsects2):
                      sname2 = data[soff2:soff2+16].rstrip(b'\x00').decode()
                      if sname2 == '__mod_init_func':
                          addr2, sz2 = struct.unpack('<QQ', data[soff2+32:soff2+48])
                          foff2, = struct.unpack('<I', data[soff2+48:soff2+52])
                          for j2 in range(sz2//8):
                              ptr2, = struct.unpack('<Q', data[foff2+j2*8:foff2+j2*8+8])
                              order.append(symname(ptr2))
                      soff2 += 80
              off2 += size2
          print("mod_init_func 顺序:", order)
          # GOOS=ios 的 runtime 入口是 __rt0_arm64_ios_lib，darwin 是 __rt0_arm64_darwin_lib
          rt0 = [n for n in order if n.startswith('__rt0_arm64_') and n.endswith('_lib')]
          assert rt0 and '_wb_ctor' in order, "初始化函数缺失"
          assert order.index(rt0[0]) < order.index('_wb_ctor'), "Go runtime 必须在 _wb_ctor 之前"
          EOF

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: wb2api.dylib
          path: |
            wb2api.dylib
            libwb2api.h
